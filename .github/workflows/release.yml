name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The tag is the source of truth for the version. The theme market
      # rejects a package whose manifest version disagrees with its catalog
      # entry, so sync it here rather than relying on the committed value.
      - name: Sync version from tag
        run: |
          # MUST be exported, not just assigned: `node -e` inherits only the
          # environment, and $GITHUB_ENV reaches later steps but not this one.
          # An unexported VERSION makes process.env.VERSION undefined, and
          # JSON.stringify DROPS a key assigned undefined — so the manifest
          # silently loses its version instead of gaining the tag's.
          export VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$'; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a valid version"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          node -e '
            const fs = require("fs");
            const version = process.env.VERSION;
            if (!version) throw new Error("VERSION is not set in the environment");
            for (const file of ["komari-theme.json", "package.json"]) {
              const json = JSON.parse(fs.readFileSync(file, "utf8"));
              json.version = version;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
            }
          '
          node -e '
            const version = require("./komari-theme.json").version;
            if (version !== process.env.VERSION) {
              throw new Error(`manifest version is ${version}, expected ${process.env.VERSION}`);
            }
            console.log(`Manifest version -> ${version}`);
          '

      - name: Typecheck
        run: pnpm exec tsc -b

      - name: Build
        run: pnpm build

      - name: Verify theme package contract
        run: pnpm verify

      # The manifest must sit at the ARCHIVE ROOT — Komari looks up the entry
      # name "komari-theme.json" exactly, so a wrapping folder breaks the upload.
      - name: Package
        run: |
          ZIP="komari-theme-observer.zip"
          rm -rf theme-package "$ZIP"
          mkdir -p theme-package
          cp komari-theme.json preview.png theme-package/
          cp -r dist theme-package/dist
          (cd theme-package && zip -qr "../$ZIP" .)
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "SHA256=$(sha256sum "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          unzip -l "$ZIP"

      # The market source has to describe the artifact that is about to be
      # published, so it is generated from the real ZIP's digest — never from a
      # guess. Written outside the worktree because the publish step below
      # checks out main and would otherwise wipe it.
      - name: Build theme market source
        run: |
          # Seed from the published catalog, not from the tag's copy, so any
          # entry added to main since the tag was cut survives the update.
          git fetch --no-tags --depth=1 origin main || true
          git show origin/main:v1.json > "$RUNNER_TEMP/v1.json" 2>/dev/null || true
          [ -s "$RUNNER_TEMP/v1.json" ] || rm -f "$RUNNER_TEMP/v1.json"

          node scripts/make-catalog.mjs --sha256="$SHA256" --out="$RUNNER_TEMP/v1.json"
          cat "$RUNNER_TEMP/v1.json"

      - name: Changelog
        run: |
          git fetch --force --tags --prune
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREVIOUS" ]; then
            LOG=$(git log --no-merges --pretty=format:'- %s (%h)' "${PREVIOUS}..${GITHUB_REF_NAME}")
          else
            LOG=$(git log --no-merges --pretty=format:'- %s (%h)' "${GITHUB_REF_NAME}")
          fi
          {
            echo 'CHANGELOG<<__EOF__'
            echo "$LOG"
            echo ""
            echo "SHA-256 \`${SHA256}\`"
            echo '__EOF__'
          } >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Observer ${{ env.VERSION }}
          body: ${{ env.CHANGELOG }}
          files: ${{ env.ZIP }}

      # Runs LAST and only after the asset exists: the catalog advertises a
      # download URL and a checksum, so publishing it before the release would
      # point every subscribed instance at a 404 for as long as the job took.
      #
      # If this step fails (branch protection, for instance), the release is
      # still good — recover with `pnpm package && pnpm catalog` and commit.
      - name: Publish market source to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          git checkout -B publish-catalog origin/main

          cp "$RUNNER_TEMP/v1.json" v1.json
          # Keep the committed manifest in step with the tag, so the next build
          # from main already carries the released version.
          node -e '
            const fs = require("fs");
            const version = process.env.VERSION;
            // Never write undefined here — JSON.stringify would drop the key and
            // push a manifest with no version at all to main.
            if (!version) throw new Error("VERSION is not set in the environment");
            for (const file of ["komari-theme.json", "package.json"]) {
              const json = JSON.parse(fs.readFileSync(file, "utf8"));
              json.version = version;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
            }
          '

          if git diff --quiet -- v1.json komari-theme.json package.json; then
            echo "Catalog and manifest already current — nothing to publish."
            exit 0
          fi
          git add v1.json komari-theme.json package.json
          git commit -m "chore: publish ${GITHUB_REF_NAME} to the theme market source"
          git push origin publish-catalog:main
